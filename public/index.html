<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>BookSocial</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/styles.css"></head><body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark"><div class="container"><a class="navbar-brand" href="#"><i class="bi bi-book-half"></i> BookSocial</a><div class="d-flex gap-2"><button class="btn btn-sm btn-outline-light nav-btn" data-tab="home">Home</button><button class="btn btn-sm btn-outline-light nav-btn" data-tab="perfil">Acceso</button></div></div></nav>
<div class="container py-3"><div id="flash" class="alert d-none"></div>
<section id="tab-home" class="tab-section"><h4>Buscar libros públicos</h4><div class="row g-2"><div class="col-md-5"><input id="searchQ" class="form-control" placeholder="Buscar título"></div><div class="col-md-4"><input id="privateCode" class="form-control" placeholder="Código privado"></div><div class="col-md-3"><button id="buscar" class="btn btn-primary w-100">Buscar</button></div></div><pre id="outLibros" class="mt-2"></pre></section>
<section id="tab-perfil" class="tab-section d-none">
  <h4>Registro e inicio de sesión</h4>
  <div class="row g-3">
    <div class="col-md-6"><div class="card p-3"><h6>Registrarse</h6><input id="regNombre" class="form-control mb-2" placeholder="Nombre"><input id="regEmail" class="form-control mb-2" placeholder="Correo"><input id="regPass" type="password" class="form-control mb-2" placeholder="Contraseña"><select id="regRol" class="form-select mb-2"><option value="lector">Lector</option><option value="autor">Autor</option><option value="mixto">Mixto</option></select><input id="regAdminCode" class="form-control mb-2" placeholder="Código admin si aplica"><button id="signup" class="btn btn-primary">Registrarse</button></div></div>
    <div class="col-md-6"><div class="card p-3"><h6>Iniciar sesión</h6><input id="logEmail" class="form-control mb-2" placeholder="Correo"><input id="logPass" type="password" class="form-control mb-2" placeholder="Contraseña"><div class="d-flex gap-2"><button id="signin" class="btn btn-success">Ingresar</button><button id="logout" class="btn btn-outline-secondary">Salir</button></div><small id="session"></small></div></div>
  </div>
  <div class="card p-3 mt-3"><h6>Obtener código de autor/admin con captcha de imagen</h6><div class="d-flex gap-2 align-items-center flex-wrap"><button id="btnLoadCaptcha" class="btn btn-warning">Generar captcha</button><img id="captchaImg" alt="captcha" style="height:60px;border:1px solid #ccc"/><input id="captchaAnswer" class="form-control" style="max-width:220px" placeholder="Escribe el código manualmente"><button id="btnCaptcha" class="btn btn-dark">Validar y mostrar código</button></div><div id="authorCodeBox" class="mt-2"></div></div>
</section>
</div><script src="/app.js"></script></body></html>
