<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontend CRUD Libros y Autores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-3">Solo Frontend - CRUD Libros y Autores</h1>

    <div class="card mb-3"><div class="card-body">
      <h5>Autenticación</h5>
      <div class="row g-2">
        <div class="col-md-4"><input id="nombre" class="form-control" placeholder="Nombre"></div>
        <div class="col-md-4"><input id="email" class="form-control" placeholder="Correo"></div>
        <div class="col-md-4"><input id="password" type="password" class="form-control" placeholder="Contraseña"></div>
      </div>
      <div class="mt-2 d-flex gap-2">
        <button class="btn btn-primary" id="signupBtn">Registrarse</button>
        <button class="btn btn-success" id="signinBtn">Iniciar sesión</button>
        <button class="btn btn-outline-danger" id="logoutBtn">Cerrar sesión</button>
      </div>
      <small id="tokenStatus" class="text-muted d-block mt-2"></small>
    </div></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card h-100"><div class="card-body">
          <h5>Autores</h5>
          <div class="row g-2 mb-2">
            <div class="col-12"><input id="autorNombre" class="form-control" placeholder="Nombre autor"></div>
            <div class="col-6"><input id="autorPais" class="form-control" placeholder="País"></div>
            <div class="col-6"><input id="autorFecha" type="date" class="form-control"></div>
            <div class="col-12 d-flex gap-2">
              <button class="btn btn-dark w-100" id="crearAutorBtn">Crear autor</button>
              <button class="btn btn-outline-primary" id="listarAutoresBtn">Listar</button>
            </div>
          </div>
          <div class="table-responsive"><table class="table table-sm align-middle">
            <thead><tr><th>ID</th><th>Nombre</th><th>País</th><th></th></tr></thead>
            <tbody id="autoresBody"></tbody>
          </table></div>
        </div></div>
      </div>

      <div class="col-lg-6">
        <div class="card h-100"><div class="card-body">
          <h5>Libros</h5>
          <div class="row g-2 mb-2">
            <div class="col-12"><input id="libroTitulo" class="form-control" placeholder="Título"></div>
            <div class="col-4"><input id="libroAnio" class="form-control" placeholder="Año"></div>
            <div class="col-4"><input id="libroAutorId" class="form-control" placeholder="ID Autor"></div>
            <div class="col-4"><input id="libroDerechos" class="form-control" placeholder="Derechos"></div>
            <div class="col-12"><input id="libroPortada" class="form-control" placeholder="URL portada"></div>
            <div class="col-12 d-flex gap-2">
              <button class="btn btn-dark w-100" id="crearLibroBtn">Crear libro</button>
              <button class="btn btn-outline-primary" id="listarLibrosBtn">Listar</button>
            </div>
          </div>
          <div class="table-responsive"><table class="table table-sm align-middle">
            <thead><tr><th>ID</th><th>Título</th><th>Autor</th><th></th></tr></thead>
            <tbody id="librosBody"></tbody>
          </table></div>
        </div></div>
      </div>
    </div>

    <div id="alerta" class="alert mt-3 d-none"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
