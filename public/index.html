<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Examen 08 - Frontend CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container py-4">
  <h1 class="mb-1">Frontend CRUD Libros/Autores</h1>
  <p class="text-muted">Todo el frontend está en carpeta <code>public/</code>.</p>

  <div id="flash" class="alert d-none"></div>

  <div class="card mb-3"><div class="card-body">
    <h5>Autenticación</h5>
    <div class="row g-2">
      <div class="col-md-4"><input id="nombre" class="form-control" placeholder="Nombre"></div>
      <div class="col-md-4"><input id="email" class="form-control" placeholder="Correo"></div>
      <div class="col-md-4"><input id="password" type="password" class="form-control" placeholder="Contraseña"></div>
    </div>
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <button class="btn btn-primary" id="btnSignup">Registrarse</button>
      <button class="btn btn-success" id="btnSignin">Iniciar sesión</button>
      <button class="btn btn-outline-secondary" id="btnLogout">Cerrar sesión</button>
    </div>
    <small id="sessionStatus" class="text-muted d-block mt-2"></small>
  </div></div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">Autores</h5>
          <button class="btn btn-sm btn-outline-primary" id="btnLoadAutores">Recargar</button>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-12"><input id="aNombre" class="form-control" placeholder="Nombre autor"></div>
          <div class="col-6"><input id="aPais" class="form-control" placeholder="País"></div>
          <div class="col-6"><input id="aFecha" type="date" class="form-control"></div>
          <div class="col-12"><button id="btnCreateAutor" class="btn btn-dark w-100">Crear autor</button></div>
        </div>
        <div class="table-responsive small-table">
          <table class="table table-sm table-striped">
            <thead><tr><th>ID</th><th>Nombre</th><th>País</th><th></th></tr></thead>
            <tbody id="tbAutores"></tbody>
          </table>
        </div>
      </div></div>
    </div>
    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">Libros</h5>
          <button class="btn btn-sm btn-outline-primary" id="btnLoadLibros">Recargar</button>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-12"><input id="lTitulo" class="form-control" placeholder="Título"></div>
          <div class="col-4"><input id="lAnio" class="form-control" placeholder="Año"></div>
          <div class="col-4"><input id="lAutor" class="form-control" placeholder="ID Autor"></div>
          <div class="col-4"><input id="lDerechos" class="form-control" placeholder="Derechos"></div>
          <div class="col-12"><input id="lPortada" class="form-control" placeholder="URL portada"></div>
          <div class="col-12"><button id="btnCreateLibro" class="btn btn-dark w-100">Crear libro</button></div>
        </div>
        <div class="table-responsive small-table">
          <table class="table table-sm table-striped">
            <thead><tr><th>ID</th><th>Título</th><th>Autor</th><th></th></tr></thead>
            <tbody id="tbLibros"></tbody>
          </table>
        </div>
      </div></div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
