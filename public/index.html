<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab07 - CRUD Libros y Autores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-3">CRUD Libros y Autores</h1>
    <p class="text-muted">Frontend de prueba para consumir la API JWT.</p>

    <section class="card mb-4">
      <div class="card-body">
        <h5>Autenticación</h5>
        <div class="row g-2">
          <div class="col-md-4"><input id="nombre" class="form-control" placeholder="Nombre"></div>
          <div class="col-md-4"><input id="email" class="form-control" placeholder="Correo"></div>
          <div class="col-md-4"><input id="password" type="password" class="form-control" placeholder="Contraseña"></div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-primary" id="btnSignup">Registrarse</button>
          <button class="btn btn-success" id="btnSignin">Iniciar sesión</button>
          <button class="btn btn-outline-secondary" id="btnLogout">Cerrar sesión</button>
        </div>
        <div id="tokenState" class="small text-muted mt-2"></div>
      </div>
    </section>

    <div class="row g-4">
      <section class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Autores</h5>
              <button class="btn btn-sm btn-outline-primary" id="refreshAutores">Refrescar</button>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-12"><input id="nombreAutor" class="form-control" placeholder="Nombre autor"></div>
              <div class="col-6"><input id="paisAutor" class="form-control" placeholder="País"></div>
              <div class="col-6"><input id="fechaAutor" type="date" class="form-control"></div>
              <div class="col-12"><button class="btn btn-dark w-100" id="crearAutor">Crear autor</button></div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm">
                <thead><tr><th>ID</th><th>Nombre</th><th>País</th></tr></thead>
                <tbody id="tablaAutores"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Libros</h5>
              <button class="btn btn-sm btn-outline-primary" id="refreshLibros">Refrescar</button>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-12"><input id="tituloLibro" class="form-control" placeholder="Título"></div>
              <div class="col-4"><input id="anioLibro" class="form-control" placeholder="Año"></div>
              <div class="col-4"><input id="autorLibro" class="form-control" placeholder="ID Autor"></div>
              <div class="col-4"><input id="derechosLibro" class="form-control" placeholder="Derechos"></div>
              <div class="col-12"><input id="portadaLibro" class="form-control" placeholder="URL portada"></div>
              <div class="col-12"><button class="btn btn-dark w-100" id="crearLibro">Crear libro</button></div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm">
                <thead><tr><th>ID</th><th>Título</th><th>Autor</th></tr></thead>
                <tbody id="tablaLibros"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="msg" class="alert d-none mt-4"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
